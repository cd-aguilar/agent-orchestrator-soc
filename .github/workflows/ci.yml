name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check
        run: python -m py_compile agents.py tools.py orchestrator.py ingest_kb.py

      - name: Run unit tests
        run: PYTHONPATH=. pytest tests/ -v

      - name: Validate docker-compose config
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t soc-orchestrator .
