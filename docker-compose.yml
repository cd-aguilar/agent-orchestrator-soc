version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: soc-orchestrator-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU opcional: descomenta si tienes NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  app:
    build: .
    container_name: soc-orchestrator-app
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./data:/app/data
      - chroma_data:/app/chroma_db
    stdin_open: true
    tty: true

volumes:
  ollama_data:
  chroma_data:
