version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: soc-orchestrator-ollama
    ports:
      - "11436:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  app:
    build: .
    container_name: soc-orchestrator-app
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - chroma_data:/app/chroma_db
    stdin_open: true
    tty: true

  n8n:
    image: n8nio/n8n:latest
    container_name: soc-orchestrator-n8n
    ports:
      - "5679:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-change-me}
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - N8N_RESTRICT_FILE_ACCESS_TO=/reports
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # Recent n8n versions block $env access from node expressions by
      # default; the "Post report to Slack" node in both workflows reads
      # the webhook URL via $env, so this needs to stay enabled.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows
      - ./reports:/reports

volumes:
  ollama_data:
  chroma_data:
  n8n_data:
